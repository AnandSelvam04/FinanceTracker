name: finance_tracker
description: Android personal finance tracker — spending, accounts, credit cards, budgets, investments and bank-SMS import, stored on the device.
version: 1.50.4+79
# An app, never published to pub.dev; also what lets it depend on the
# vendored plugin by path.
publish_to: none
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  # Zips the worksheets of an Excel export (lib/services/excel_export.dart).
  archive: ^4.0.0
  cryptography: ^2.7.0
  csv: ^8.0.0
  file_picker: ^10.3.7
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  # Pick a receipt/bill photo from the camera or gallery for OCR scanning,
  # and capture voice input to add an expense hands-free.
  image_picker: ^1.1.2
  # On-device OCR (ML Kit) that reads a bill photo into text; parsed by
  # lib/services/receipt_parser.dart into a draft transaction. Runs locally —
  # the image never leaves the device.
  google_mlkit_text_recognition: ^1.0.1
  # On-device speech recognition for the "add by voice" flow.
  speech_to_text: ^7.0.0
  flutter_local_notifications: ^22.3.3
  flutter_timezone: ^5.1.1
  http: ^1.1.0
  google_sign_in: ^6.1.5
  googleapis: ^18.0.0
  googleapis_auth: ^2.0.0
  local_auth: ^3.0.0
  package_info_plus: ^8.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.11.0
  provider: ^6.0.0
  share_plus: ^10.0.0
  shared_preferences: ^2.5.3
  # SQLCipher-backed drop-in replacement for sqflite; enables optional
  # at-rest encryption of the local database.
  sqflite_sqlcipher: ^3.1.0
  flutter_secure_storage: ^9.2.2
  timezone: ^0.11.2
  # Reads the SMS inbox for bank transaction alerts (Android only). The
  # original `telephony` package is unmaintained; this is the maintained fork.
  # Requires READ_SMS, which Play Store policy restricts — fine here because
  # the app is sideloaded, but it is why this cannot ship to the store.
  # Vendored with one fix, because the published 0.4.1 crashes the app on any
  # permission dialog; see third_party/another_telephony/PATCHES.md.
  another_telephony:
    path: third_party/another_telephony
  home_widget: ^0.10.0
  permission_handler: ^13.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  sqflite_common_ffi: ^2.3.3
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/FreeSans.ttf
    - assets/fonts/FreeSansBold.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#4B3FE4"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
