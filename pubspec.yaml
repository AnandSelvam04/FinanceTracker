name: finance_tracker
description: A new Flutter project for tracking finances.
version: 1.8.1+14
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  cryptography: ^2.7.0
  csv: ^6.0.0
  file_picker: ^10.3.7
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.2.3
  flutter_timezone: ^3.0.1
  http: ^1.1.0
  google_sign_in: ^6.1.5
  googleapis: ^15.0.0
  googleapis_auth: ^2.0.0
  local_auth: ^3.0.0
  package_info_plus: ^8.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.11.0
  provider: ^6.0.0
  share_plus: ^10.0.0
  shared_preferences: ^2.5.3
  # SQLCipher-backed drop-in replacement for sqflite; enables optional
  # at-rest encryption of the local database.
  sqflite_sqlcipher: ^3.1.0
  flutter_secure_storage: ^9.2.2
  timezone: ^0.9.4
  # Reads the SMS inbox for bank transaction alerts (Android only). The
  # original `telephony` package is unmaintained; this is the maintained fork.
  # Requires READ_SMS, which Play Store policy restricts — fine here because
  # the app is sideloaded, but it is why this cannot ship to the store.
  another_telephony: ^0.4.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  sqflite_common_ffi: ^2.3.3
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/FreeSans.ttf
    - assets/fonts/FreeSansBold.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1B5E20"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
