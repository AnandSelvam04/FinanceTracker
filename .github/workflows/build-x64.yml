name: Build x64 APK

# Builds only the x86_64 (android-x64) ABI. Most phones are arm64, so this
# variant is primarily for x86_64 Android emulators and the rare x86_64 device.
# The regular CI workflow still builds the arm64-v8a release for real hardware.
on:
  workflow_dispatch:
  push:
    branches: [main]
    # Only rebuild when something that affects the APK changes.
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-x64.yml'

# Cancel superseded runs so we never burn CI time on stale commits.
concurrency:
  group: build-x64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x64-apk:
    runs-on: ubuntu-latest
    # GitHub Actions is free for public repositories on standard runners.
    # Guard on visibility so the workflow never consumes billable minutes if
    # the repo (or a fork) is private.
    if: ${{ github.event.repository.private == false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Stamp the build so Settings > About shows which commit an installed
      # APK came from (see lib/utils/build_info.dart).
      - name: Resolve build identity
        id: build_id
        run: |
          echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      # x86_64 only. --split-per-abi keeps the per-ABI output name
      # (app-x86_64-release.apk) instead of a generic app-release.apk.
      # Signed with the real release key: android/key.properties and the
      # keystore are committed on purpose (see android/app/build.gradle.kts).
      - run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-x64 \
            --dart-define=APP_VERSION=${{ steps.build_id.outputs.version }} \
            --dart-define=GIT_SHA=${{ steps.build_id.outputs.sha }}
      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-release
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          # Keep artifact storage short-lived (free for public repos anyway).
          retention-days: 14
