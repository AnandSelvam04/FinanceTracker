name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs so we never burn CI time on stale commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    # GitHub Actions is free (unlimited minutes + storage) for public
    # repositories on standard runners. Guard on visibility so the workflow
    # never consumes billable minutes if the repo (or a fork) is private.
    if: ${{ github.event.repository.private == false }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: Flutter 3.50 deprecates package:flutter/material.dart
          # itself, so every file fails `flutter analyze` until the app
          # moves to material_ui. Raise this together with that migration.
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-apk:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: ${{ github.event.repository.private == false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: Flutter 3.50 deprecates package:flutter/material.dart
          # itself, so every file fails `flutter analyze` until the app
          # moves to material_ui. Raise this together with that migration.
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      # Stamp the build so Settings > About shows which commit an installed
      # APK came from (see lib/utils/build_info.dart).
      - name: Resolve build identity
        id: build_id
        run: |
          echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      # arm64-v8a only: every phone this app is installed on is 64-bit ARM,
      # and dropping armeabi-v7a/x86_64 cuts most of the build time. Keep
      # --split-per-abi even with a single target so the output keeps its
      # per-ABI name (app-arm64-v8a-release.apk) rather than app-release.apk.
      - name: Write release signing key from secrets
        run: .github/scripts/setup-signing.sh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # Signed with the release key written by the step above, from
      # repository secrets (docs/SIGNING.md).
      - run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64 \
            --dart-define=APP_VERSION=${{ steps.build_id.outputs.version }} \
            --dart-define=GIT_SHA=${{ steps.build_id.outputs.sha }}
      # Proves what was actually produced: the package name the phone will
      # install under, the Android version it needs, and that the APK really
      # carries a v2/v3 signature. An unsigned or v1-only APK is refused by
      # Android 11+ with nothing but "App not installed", so it is worth
      # catching here rather than on the phone.
      - name: Describe and verify the APK
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "${tools}aapt2" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code)"
          "${tools}apksigner" verify --verbose --print-certs "$apk"
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          # Keep artifact storage short-lived (free for public repos anyway).
          retention-days: 14
